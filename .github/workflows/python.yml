name: Kurigram

on:
  # Branches live in this repository and are tested through their pull request, so an
  #  unfiltered `push` ran the whole workflow a second time for the same commit.
  push:
    branches: [main]
  pull_request:
  # Every job above installs from `uv.lock`, so a dependency release published after the last
  #  `uv lock` is exercised by nothing until somebody happens to relock. `test-ceil` resolves
  #  fresh and is what catches it, which only helps if something runs it without a push.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      # `checkout` and `make sync` are written once here and reused by YAML alias. `setup-uv` is
      #  written out per job: Actions has no merge keys (`<<:`) to share its `uses:` under a
      #  per-job `with:` (https://github.com/orgs/community/discussions/185877), and Dependabot
      #  bumps the SHA of an anchored `uses:` scalar but leaves its version comment stale.
      - &checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # `uv` supplies the interpreter as well as the packages, so there is no separate
      #  Python setup step: it downloads a managed CPython for every version in the
      #  matrix, including versions no longer shipped as an official macOS arm64 build.
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - &sync
        name: Install dependencies
        run: |
          make sync

      - name: Generate API
        run: |
          make api

      # The integration tests need live api credentials, which a fork's runner has
      #  no way to hold, so they stay deselected and skip on their own besides.
      - name: Run tests
        run: |
          make test-unit

  lint:

    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - *sync

      # `ruff` excludes the generated packages, so this job needs no `make api`.
      - name: Run ruff
        run: |
          make lint

  # Its own job rather than a tail step of `lint`: a `ruff` failure would otherwise
  #  hide the `ty` verdict until the next push.
  typecheck:

    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - *sync

      # Unlike `ruff`, `ty` resolves `pyrogram.raw.*`, so it needs the generated tree.
      - name: Generate API
        run: |
          make api

      - name: Run ty
        run: |
          make typecheck

  # The recipe names the interpreter and `uv` provisions it, so neither of these jobs pins one:
  #  `setup-uv`'s `python-version` would export `UV_PYTHON` over the whole workflow.
  test-floor:

    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Builds `.venv-floor` and generates the API in it, so no `make sync` or `make api` here.
      - name: Run the suite at the dependency floor
        run: |
          make test-floor

  test-ceil:

    runs-on: ubuntu-latest

    steps:
      - *checkout

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run the suite at the dependency ceiling
        run: |
          make test-ceil
