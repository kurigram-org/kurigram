name: Pyrogram

on: [push, pull_request]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          make venv-dev

      - name: Generate API
        run: |
          make api

      # The integration tests need live api credentials, which a fork's runner has
      #  no way to hold, so they stay deselected and skip on their own besides.
      - name: Run tests
        run: |
          make test-unit

  lint:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          make venv-dev

      # `ruff` excludes the generated packages, so this step alone needs no `make api`.
      - name: Run ruff
        run: |
          make lint

      # Unlike `ruff`, `ty` resolves `pyrogram.raw.*`, so it needs the generated tree.
      - name: Generate API
        run: |
          make api

      - name: Run ty
        run: |
          make typecheck
